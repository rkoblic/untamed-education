const slides=[
()=>`<div class="slide-inner"><div class="eyeline">An unfinished thought experiment</div><h1 style="max-width:1050px">What if education looked <em class="accent">nothing like school?</em></h1><p class="lead">A song. A garden. A relationship. An improbable ambition. Could all of them become the starting point for a rigorous education?</p><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:29px">${[['song','Follow a song','An obsession opens into other fields'],['garden','Tend a garden','The same practice deepens over time'],['mentor','Be someone’s person','A relationship becomes a responsibility'],['submarine','Build a submarine','The learner invents the undertaking']].map(([img,title,desc],i)=>`<button data-action="intro" data-val="${i}" class="button-tile"><div class="media" style="height:146px;border-radius:0">${media(img)}</div><div class="copy"><h3>${title}</h3><p>${desc}</p><span class="clickmark">EXPLORE THIS IDEA ↗</span></div></button>`).join('')}</div></div>${sourceFooter()}`,
()=>`<div class="slide-inner"><div class="eyeline">Where the exploration began</div><h2 style="font-size:43px;line-height:1.1">Making the Unfamiliar Familiar: <em>A New Model in Familiar Clothing.</em></h2><p class="lead" style="margin-bottom:10px">Paul's recent work contains both an expansive vision of learning and a familiar way of expressing what students might earn.</p><p style="font-size:18px;line-height:1.42;max-width:1095px;margin:0 0 10px;color:#314e47"><strong>The challenge I posed to myself:</strong> What radically different educational experiences could lead to a familiar transcript or degree map? Could we design ideal learning journeys, decoupled from traditional formats, and then translate them into familiar artifacts for the world that needs them?</p><div class="columns" style="grid-template-columns:1fr 48px 1fr 48px 1fr;gap:10px;align-items:center;margin-top:14px"><div class="tile sage" style="height:296px"><div class="micro">THE EDUCATIONAL VISION</div><div class="big" style="font-size:31px;line-height:1.14;margin:10px 0">What Untamed is ultimately trying to make possible.</div><p>Human growth through real work, relationships, curiosity, and choice. Know, Think, Act, and Connect developed together.</p><div class="small" style="margin-top:12px">The aspiration</div></div><div style="text-align:center;font-size:40px;font-weight:700;color:#6b836f">→</div><div class="tile rose" style="height:296px"><div class="micro">THE EXPERIENCE</div><div class="big" style="font-size:31px;line-height:1.14;margin:10px 0">What the learner actually lives through.</div><p>Questions, projects, practices, relationships, surprises, and evolving chapters. This is the part the learner touches and experiences.</p><div class="small" style="margin-top:12px">The lived journey</div></div><div style="text-align:center;font-size:40px;font-weight:700;color:#6b836f">→</div><div class="tile sand" style="height:296px"><div class="micro">THE FAMILIAR RECORD</div><div class="big" style="font-size:31px;line-height:1.14;margin:10px 0">A recognizable account of what the learner can now do.</div><p>A transcript, degree map, competency record, or similar framework that makes the learning legible to others.</p><div class="small" style="margin-top:12px">The recognition framework</div></div></div></div>${sourceFooter('THE DEGREE MAP IS A TRANSLATION OF LEARNING, NOT THE LEARNING ITSELF')}`,
()=>`<div class="slide-inner"><div class="eyeline">The translation insight</div><h2 style="max-width:1040px">Design the experience first.<br><em class="accent">Translate the learning afterward.</em></h2><p class="lead">The learner may experience an investigation, an apprenticeship, or an evolving series of encounters. Universities and employers still need recognizable, trustworthy evidence of what that person learned.</p><div class="sequence" style="margin-top:46px"><div class="seqbox"><div class="micro">WHAT THEY LIVE</div><h3>Meaningful experiences</h3><p class="small">Questions, relationships, practice, work, discoveries</p></div><div class="arrow" style="align-self:center">→</div><div class="seqbox"><div class="micro">WHAT WE CAN INSPECT</div><h3>Evidence of capability</h3><p class="small">Work, decisions, feedback, performance, reflection</p></div><div class="arrow" style="align-self:center">→</div><div class="seqbox"><div class="micro">WHAT WE CAN VERIFY</div><h3>Demonstrated mastery</h3><p class="small">Assessment against explicit standards, with human judgment</p></div><div class="arrow" style="align-self:center">→</div><div class="seqbox"><div class="micro">WHAT THE WORLD SEES</div><h3>Credible translations</h3><p class="small">Competencies, credits, portfolio, transcript, résumé</p></div></div><div class="lines" style="margin-top:32px"><p class="quote" style="font-size:29px">“We don't have to build in that structure as long as we can translate into that structure.”</p><p style="margin-top:8px;font-size:14px;color:#c7dcd0">From the November 11 team discussion</p></div></div>${sourceFooter('TRANSLATION REQUIRES EVIDENCE, NOT ASSUMPTION')}`,
()=>`<div class="slide-inner"><div class="eyeline">From divergent brainstorming to a first set of patterns</div><h2>First, we imagined 76 different possibilities.</h2><p class="lead" style="margin-bottom:12px">A year at sea. A garden. Mentoring a child. Inventing a civilization. Reading every issue of the local newspaper. We deliberately went beyond what a college would normally offer.</p><p style="font-size:17px;line-height:1.35;color:#314e47;margin:0 0 12px">As the list grew, we began to recognize recurring ways an experience could be organized. Here is a snapshot of the <b>15 families</b> we used to make sense of the ideas.</p><div style="display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px">${ideaCategories.map((cat,i)=>`<div class="tile" style="background:${i%3===0?'#e8eee7':i%3===1?'#f0e9dc':'#f2e7e2'};padding:11px 12px;height:83px;overflow:hidden"><div class="micro" style="font-size:10px;margin-bottom:6px">${String(i+1).padStart(2,'0')} · ${cat.end-cat.start+1} IDEAS</div><div style="font-family:Georgia,serif;font-size:17px;font-weight:600;line-height:1.16">${cat.name}</div></div>`).join('')}</div><div class="row spread" style="margin-top:15px;gap:14px"><p style="font-size:16px;line-height:1.4;margin:0;max-width:800px"><b>The shift:</b> We weren't just collecting unusual activities. We were finding different ways learning could unfold—through curiosity, repetition, surprise, responsibility, imagination, and more.</p><button class="control" data-action="ideas" style="white-space:nowrap">Browse all 76 ideas ↗</button></div></div>${sourceFooter('76 PROVOCATIONS · 15 EMERGING FAMILIES')}`,
()=>`<div class="slide-inner"><div class="eyeline">Example: The Universe in a Song <span style="font-weight:400;opacity:.8">(interactive)</span></div><h2>Start with one song. Follow the questions.</h2><p class="lead" style="margin-bottom:16px">A learner starts with a song they love. Each question leads to others about sound, history, culture, mathematics, and technology. Knowledge and skills from different disciplines come together in one evolving experience, rather than being taught as separate courses.</p><div class="cols4060" style="grid-template-columns:390px 1fr;gap:23px"><div class="media" style="height:430px">${media('song')}</div><div><div class="tabbar" style="margin:0 0 12px">${branches.map((b,i)=>`<button class="pill ${branch===i?'active':''}" data-action="branch" data-val="${i}">${b.name}</button>`).join('')}</div><div class="info-panel" style="min-height:283px"><div class="micro">A QUESTION WORTH FOLLOWING</div><h3 style="font-size:29px;margin:12px 0">${branches[branch].q}</h3><p style="font-size:16px;line-height:1.5">${branches[branch].more}</p><div class="ruleline"></div><div class="micro">POSSIBLE EVIDENCE</div><p style="font-size:15px">${branches[branch].e}</p><div class="chipline">${branches[branch].codes.map(c=>`<span class="chip">${c}</span>`).join('')}</div></div></div></div></div>${sourceFooter()}`,
()=>`<div class="slide-inner"><div class="eyeline">Example: The Universe in a Song · competency mapping</div><h2 style="font-size:45px">What could the learner actually demonstrate?</h2><p class="lead" style="font-size:18px;margin-bottom:14px;max-width:1090px">We mapped the song investigation against Paul's 15 shared course groupings. Some are a natural fit, some would need more deliberate learning and assessment, and some do not fit. We also asked what this experience might develop beyond the degree framework.</p><div style="display:grid;grid-template-columns:1.15fr .85fr;gap:18px"><div class="tile" style="padding:20px 24px;min-height:352px"><div class="row spread" style="margin-bottom:12px"><div><div class="micro">POTENTIAL FIT · 15 SHARED COURSE GROUPINGS</div><p class="small" style="margin:4px 0 0">10 general education + 5 durable skills</p></div><span style="font-size:14px;color:#53645f">Illustrative, not credit awarded</span></div><div class="stacked" style="height:29px;border-radius:7px"><i class="s" style="width:40%"></i><i class="p" style="width:40%"></i><i class="g" style="width:20%"></i></div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:16px 0 13px"><div><div style="font:34px Georgia;color:#3e8c78">6 <span style="font:15px Arial;color:#263c35">strong</span></div><p class="small">G1, G2, G5, G10, D1, D3</p></div><div><div style="font:34px Georgia;color:#a77530">6 <span style="font:15px Arial;color:#263c35">partial</span></div><p class="small">G3, G4, G7, G8, D2, D4</p></div><div><div style="font:34px Georgia;color:#67756f">3 <span style="font:15px Arial;color:#263c35">gaps</span></div><p class="small">G6, G9, D5</p></div></div><div class="ruleline" style="margin:13px 0"></div><p style="font-size:15px;line-height:1.45;margin:0"><b>For example:</b> Researching the song’s history could support G2 Research and Argument. Studying rhythm only partly addresses G3 Quantitative Reasoning. It doesn't establish G6 Human Biology.</p><button class="readmore" style="margin-top:12px" data-action="songmapping">See all 15 course mappings ↗</button></div><div class="tile sage" style="padding:21px 23px;min-height:352px"><div class="micro">WHAT THE FRAMEWORK MAY NOT FULLY CAPTURE</div><h3 style="font-size:29px;margin:11px 0 14px">More than a transcript</h3><div style="display:grid;gap:11px;font-size:15px;line-height:1.4"><div><b>Musical expertise</b><br>Listening, analyzing, composing, and developing aesthetic judgment.</div><div><b>Curiosity and synthesis</b><br>Asking better questions and making connections across disciplines.</div><div><b>Self-understanding</b><br>Discovering interests and learning to stay with ambiguity.</div></div><p class="small" style="margin-top:18px">Some of these are partly reflected in Paul’s competencies; others may deserve recognition in a richer learner profile.</p></div></div><p class="note" style="margin-top:12px">Strong means a plausible opportunity to demonstrate most or all of a course grouping’s competencies—not that the learner has mastered them. Each claim would still need appropriate evidence and verification.</p></div>${sourceFooter('OPPORTUNITY MAPPING · NOT EARNED CREDITS')}`,
()=>`<div class="slide-inner"><div class="eyeline">8 built-out examples</div><h2>Different experiences. Different ways of learning.</h2><p class="lead" style="margin-bottom:15px">We deliberately chose eight contrasting ideas to explore in more detail. As we worked through them, we began to recognize different archetypes—ways an experience can generate learning. Select one to explore.</p><div class="cols6040" style="grid-template-columns:675px 1fr;gap:23px;margin-top:16px"><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px">${cases.map((c,i)=>`<button class="jcard ${caseIndex===i?'active':''}" data-action="case" data-val="${i}" style="min-height:180px;padding:14px 12px;display:flex;flex-direction:column;align-items:flex-start"><div style="font-size:30px;color:#457e6d;line-height:1">${c.icon}</div><div class="serif" style="font-size:21px;line-height:1.13;margin:10px 0 9px">${c.mechanism}</div><div style="font-size:12px;color:#61756c;line-height:1.3;margin-top:auto">${c.title}</div></button>`).join('')}</div><div class="tile" style="height:375px;background:#e6eadd;padding:21px 23px;display:flex;flex-direction:column"><div class="micro">EXAMPLE ${cases[caseIndex].number} · ${cases[caseIndex].title}</div><div style="font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#607469;font-weight:800;margin-top:19px">A learner arrives saying...</div><div class="big" style="font-size:32px;line-height:1.13;margin:8px 0 15px">${cases[caseIndex].start}</div><p style="font-size:16px;line-height:1.43;margin:0;color:#304d43">${cases[caseIndex].experience}</p><div style="border-top:1px solid #bfcfbe;padding-top:12px;margin-top:auto"><div class="micro" style="margin-bottom:6px">DESIGN QUESTION</div><p style="font-size:14px;line-height:1.4;margin:0;color:#4d6257">${cases[caseIndex].tension}</p></div></div></div></div>${sourceFooter()}`,
()=>`<div class="slide-inner"><div class="eyeline">Three developmental trajectories</div><h2>Learning can move in different directions.</h2><p class="lead">The Song branches outward from a fascination. The Garden grows deeper through repetition. The Anti-Algorithm ranges widely until a new direction becomes visible.</p><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:28px">${[['THE SONG','One fascination branches outward',`<g stroke="#4e8d7a" stroke-width="3" fill="none"><path d="M190 215 V169 L115 103 M190 169 L260 101 M115 103 L75 46 M115 103 L146 48 M260 101 L225 42 M260 101 L300 48"/></g><g fill="#bf7857"><circle cx="190" cy="215" r="11"/><circle cx="190" cy="169" r="8"/><circle cx="115" cy="103" r="9"/><circle cx="260" cy="101" r="9"/><circle cx="75" cy="46" r="9"/><circle cx="146" cy="48" r="9"/><circle cx="225" cy="42" r="9"/><circle cx="300" cy="48" r="9"/></g>`],['THE GARDEN','Repeated engagement grows deeper',`<path d="M190 223 C300 200 85 178 190 155 C297 130 88 100 190 70 C270 45 148 34 190 18" stroke="#4e8d7a" stroke-width="4" fill="none"/><g fill="#bf7857" opacity=".9"><circle cx="190" cy="223" r="8"/><circle cx="190" cy="155" r="13"/><circle cx="190" cy="70" r="20"/><circle cx="190" cy="18" r="27"/></g>`],['ANTI-ALGORITHM','Many encounters reveal a direction',`<path d="M85 50 L268 85 L121 134 L256 189 L191 228" fill="none" stroke="#819d8e" stroke-width="3" stroke-dasharray="6 7"/><g fill="#bc906e"><circle cx="85" cy="50" r="12"/><circle cx="268" cy="85" r="13"/><circle cx="121" cy="134" r="13"/><circle cx="256" cy="189" r="13"/></g><circle cx="191" cy="228" r="24" fill="#4e8d7a"/>`]].map(([name,sub,svg])=>`<div class="tile" style="background:#fdfbf5;padding:17px 19px"><div class="micro">${name}</div><svg viewBox="0 0 380 255" style="width:100%;height:230px;margin-top:12px" role="img" aria-label="${sub}">${svg}</svg><div class="serif" style="font-size:21px;line-height:1.2">${sub}</div></div>`).join('')}</div><div class="lines" style="margin-top:19px;padding:14px 20px"><p style="font-size:16px">All three can develop <b>Know, Think, Act and Connect</b>. What differs is how the learner encounters breadth, depth, agency and connection. <button style="margin-left:12px;color:#182c2b;background:#fffefa" class="control" data-action="pillars">Read full pillar definitions ↗</button></p></div></div>${sourceFooter()}`,

<div style="font-size:13px;line-height:1.37;color:#edf3ed"><b style="color:#edd7a4">The invitation</b><div>They ${a.opening}. ${starts[o.start](a)}</div></div>
<div style="font-size:13px;line-height:1.37;color:#edf3ed"><b style="color:#edd7a4">How it unfolds</b><div>${developments[o.mechanism][o.arena]}</div></div>
<div style="font-size:13px;line-height:1.37;color:#edf3ed"><b style="color:#edd7a4">The rule changes the next move</b><div>${ruleEffects[o.rule][o.arena]}</div></div>

()=>`<div class="slide-inner"><div class="eyeline">What the eight cases taught us</div><h2>Academic fit is only part of the picture.</h2><p class="lead">Some experiences naturally create opportunities across several courses. Others may be transformative for reasons the transcript captures only partially.</p><div class="tabbar" style="margin-top:21px"><button class="pill ${comparison==='credential'?'active':''}" data-action="compare" data-val="credential">Competency opportunities</button><button class="pill ${comparison==='growth'?'active':''}" data-action="compare" data-val="growth">What the transcript may miss</button></div>${comparison==='credential'?`<div class="tile" style="margin-top:15px;padding:20px 28px"><div class="micro" style="margin-bottom:16px">ILLUSTRATIVE ALIGNMENT WITH PAUL'S 15 SHARED COURSE GROUPINGS</div><div class="bars">${cases.map(c=>`<div class="baritem"><span>${c.title}</span><div class="stacked"><i class="s" style="width:${c.s/15*100}%"></i><i class="p" style="width:${c.p/15*100}%"></i><i class="g" style="width:${c.g/15*100}%"></i></div></div>`).join('')}</div><div class="legend"><span><i class="dot s"></i> Strong opportunity</span><span><i class="dot p"></i> Partial opportunity</span><span><i class="dot g"></i> Gap</span></div><p class="small" style="margin:13px 0 0">These ratings describe possible learning opportunities across broad course groupings. They are not course completions, transferable credits, or assessments of actual learners.</p></div>`:`<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px">${[['Care and trust','Reliability, empathy, appropriate boundaries, and long-term responsibility'],['Imagination','Inventing alternatives and testing the consequences of imagined worlds'],['Attention','Noticing patterns over time and developing tacit practical judgment'],['Self-authorship','Learning to choose and sustain a meaningful direction'],['Intellectual curiosity','Generating questions worth investigating and pursuing them'],['Systems thinking','Connecting ideas, people, institutions, and consequences across fields']].map(([a,b])=>`<div class="tile" style="min-height:140px"><h3 style="font-size:24px">${a}</h3><p style="font-size:15px">${b}</p></div>`).join('')}</div><p class="note" style="margin-top:17px">These qualities may be partly reflected in Paul's framework. The question is whether the institution wants richer ways to recognize growth beyond a conventional transcript.</p>`}</div>${sourceFooter('COMPARATIVE DESIGN JUDGMENTS, NOT PERFORMANCE DATA')}`,
()=>`<div class="slide-inner" style="padding-top:51px"><div class="eyeline">From a generative grammar to an evolving journey</div><h2 style="font-size:49px;line-height:1.07;margin-bottom:14px">Why commit to one kind of experience for two years?</h2><p class="lead" style="font-size:21px;line-height:1.36;max-width:1110px;margin-bottom:16px">A learner could spend a few months exploring unfamiliar worlds, then follow a question that catches their attention, and later commit to someone or something that matters. Another learner might stay with one practice for two years. The journey takes shape along the way.</p><div style="display:grid;grid-template-columns:1fr 42px 1fr 42px 1fr;gap:10px;align-items:center;margin-top:22px"><div class="tile sage" style="height:210px;padding:20px"><div class="micro">A POSSIBLE CHAPTER</div><div class="serif" style="font-size:29px;margin:16px 0 12px">Encounter</div><p style="font-size:16px">Try something unfamiliar. Notice what sparks a question.</p></div><div style="text-align:center;color:#ad735d;font-size:28px">→</div><div class="tile sand" style="height:210px;padding:20px"><div class="micro">AN EMERGING CHAPTER</div><div class="serif" style="font-size:29px;margin:16px 0 12px">Investigate</div><p style="font-size:16px">Follow a curiosity into deeper knowledge and practice.</p></div><div style="text-align:center;color:#ad735d;font-size:28px">→</div><div class="tile rose" style="height:210px;padding:20px"><div class="micro">A POSSIBLE NEXT CHAPTER</div><div class="serif" style="font-size:29px;margin:16px 0 12px">Contribute</div><p style="font-size:16px">Take on a responsibility or create something with others.</p></div></div><div class="lines" style="margin-top:19px;padding:16px 22px"><div class="serif" style="font-size:25px;line-height:1.18">Then we noticed something else: <em style="color:#e6d09d">the spaces between chapters could matter just as much.</em></div><p style="font-size:15px;color:#e1e8df;margin-top:8px">Reflection, conversations, and recognizing what has changed can help the learner decide whether to deepen, branch, pause, or begin something new.</p></div><p class="note" style="margin-top:12px">These are illustrations, not required stages or six-month courses. Chapters may last different lengths, overlap, or emerge without a clear boundary.</p></div>${sourceFooter('THE LEARNER’S JOURNEY IS NOT A PRESET COURSE SEQUENCE')}`,
()=>`<div class="slide-inner"><div class="eyeline">One illustrative learner · Alex, age 18</div><h2>A journey that wasn't planned in advance.</h2><div style="background:#e8eee6;border-left:4px solid #478874;border-radius:8px;padding:13px 18px;margin-top:12px"><div class="micro" style="margin-bottom:6px">WHERE ALEX BEGINS</div><p style="font-size:18px;line-height:1.42;margin:0">Alex is 18 and finishing high school. College feels like an expensive commitment to a direction Alex hasn't found yet. Most interests have come from familiar friends, feeds, and routines. Alex is curious but isn't ready to choose a major or a career—and wants to discover what else might matter.</p></div><div class="journey alex-journey" style="margin-top:18px">${chapters.map((c,i)=>`<button class="jcard ${chapter===i?'active':''}" data-action="chapter" data-val="${i}"><div class="num">${c.span}</div><h3>${c.name}</h3><p>${c.question}</p><div class="clickmark" style="margin-top:22px">READ THIS CHAPTER ↗</div></button>`).join('')}</div><div class="info-panel" style="margin-top:14px;display:grid;grid-template-columns:190px 1fr;gap:16px;min-height:125px;padding:14px 18px"><div><div class="micro">${chapters[chapter].span}</div><h3 style="font-size:25px;margin-top:8px">${chapters[chapter].name}</h3></div><div><p style="font-size:16px;margin:0">${chapters[chapter].story}</p><p style="font-size:15px;margin:10px 0 0"><strong>What emerges:</strong> ${chapters[chapter].next}</p></div></div><p class="note" style="margin-top:8px">These aren't four standardized six-month courses. Threads can overlap; a mentoring commitment or garden practice could continue through several chapters.</p></div>${sourceFooter('A NARRATIVE EXAMPLE, NOT A PRESCRIBED SEQUENCE')}`,
()=>`<div class="slide-inner"><div class="eyeline">The spaces between chapters</div><h2>What happens <em class="accent">between</em> experiences?</h2><p class="lead">A pause can become a meaningful part of education: reflecting, talking with others, noticing change, and deciding what to do next.</p><div class="tabbar" style="margin-top:27px">${transitions.map((v,i)=>`<button class="pill ${transition===i?'active':''}" data-action="transition" data-val="${i}">${v.label}</button>`).join('')}</div><div class="tile sage" style="margin-top:18px;min-height:335px;padding:29px"><div class="micro">THE QUESTION ALEX MIGHT ASK</div><div class="big" style="font-size:40px;line-height:1.2;margin:18px 0 20px">“${transitions[transition].q}”</div><p style="font-size:17px"><b>In this imagined story:</b> ${transitions[transition].actual}</p><div class="ruleline"></div><div class="micro">OTHER LEGITIMATE DIRECTIONS</div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:13px">${transitions[transition].alts.map(x=>`<div class="tile" style="padding:13px;font-size:14px;min-height:65px">${x}</div>`).join('')}</div></div><p class="note" style="margin-top:15px">A coach and AI partner can help surface options and patterns. Neither should decide the learner's life for them.</p></div>${sourceFooter()}`,
()=>`<div class="slide-inner" style="padding-top:43px"><div class="eyeline">Alex's learning · evidence across four chapters · interactive</div><h2 style="font-size:44px;margin-bottom:10px">What did Alex learn—and what could we demonstrate?</h2><p class="lead" style="font-size:17px;line-height:1.32;margin-bottom:17px">Each experience leaves different kinds of work and observations. Select a chapter to see what an assessor might examine and what we can—or cannot—claim from it.</p><div style="display:grid;grid-template-columns:355px 1fr;gap:16px;align-items:stretch"><div style="display:flex;flex-direction:column;gap:9px">${alexChapterEvidence.map((v,i)=>`<button class="tile ${alexEvidenceIndex===i?'sage':''}" style="text-align:left;padding:15px 18px;min-height:80px;border:2px solid ${alexEvidenceIndex===i?'#4c8c77':'transparent'}" data-action="alexEvidence" data-val="${i}"><div class="micro" style="font-size:10px">CHAPTER ${i+1} · ${v.chapter}</div><div class="serif" style="font-size:22px;line-height:1.14;margin-top:5px">${v.short} <span style="float:right;font-size:16px">↗</span></div></button>`).join('')}</div><div class="tile" style="background:#e5ebdf;padding:19px 22px;min-height:348px"><div class="micro">WHAT ALEX PRODUCED · ${alexChapterEvidence[alexEvidenceIndex].chapter.toUpperCase()}</div><p style="font-size:16px;line-height:1.37;margin:7px 0 13px">${alexChapterEvidence[alexEvidenceIndex].work}</p><div class="micro">WHAT AN ASSESSOR COULD EXAMINE</div><p style="font-size:15px;line-height:1.35;margin:7px 0 12px">${alexChapterEvidence[alexEvidenceIndex].proof}</p><div class="micro">POSSIBLE COMPETENCY CONNECTIONS</div><div class="chipline" style="margin-top:7px">${alexChapterEvidence[alexEvidenceIndex].codes.map(c=>`<span class="chip" style="font-size:11px">${c}</span>`).join('')}</div><div class="ruleline" style="margin:11px 0"></div><p style="font-size:13px;line-height:1.3;margin:0"><b>What remains to establish:</b> ${alexChapterEvidence[alexEvidenceIndex].gap}</p></div></div><div style="display:flex;align-items:center;gap:8px;margin-top:16px"><div class="micro" style="min-width:150px">EVIDENCE PROGRESSION</div>${['Encountered','Practiced','Demonstrated','Verified'].map((n,i)=>`<div style="flex:1;text-align:center;border-radius:8px;padding:10px 6px;background:${i<=alexChapterEvidence[alexEvidenceIndex].stage?'#c8dfcf':'#e5e5de'};font-size:13px;font-weight:${i===alexChapterEvidence[alexEvidenceIndex].stage?'700':'400'}">${n}</div>`).join('')}</div><p class="note" style="margin-top:10px;font-size:12px">Illustrative evidence status, not an actual assessment or credit award. Each individual competency needs its own judgment; mentoring documentation must protect the child's privacy.</p></div>${sourceFooter('EXPERIENCE → EVIDENCE → ASSESSMENT → CREDIBLE CLAIM')}`,

()=>`<div class="slide-inner" style="padding-top:45px"><div class="eyeline">A possible translation artifact · illustrative</div><h2 style="font-size:45px;margin-bottom:9px">What might Alex's familiar record look like?</h2><p class="lead" style="font-size:17px;line-height:1.32;margin-bottom:12px">The course titles are familiar, but the evidence comes from Alex's experiences. Looking inside one grouping reveals different stages of progress—not simply a course marked complete.</p><div style="display:grid;grid-template-columns:1.75fr .8fr;gap:16px"><div class="tile" style="background:#fdfbf6;padding:15px 20px;height:425px"><div style="display:flex;justify-content:space-between;align-items:start;border-bottom:2px solid #cdd7cc;padding-bottom:8px"><div><div class="micro">UNTAMED · SIMULATED COMPETENCY RECORD</div><h3 style="font-size:25px;margin:4px 0 0">Alex · academic crosswalk</h3></div><div style="font-size:11px;text-align:right;color:#68776e;font-weight:bold">FICTIONAL ASSESSMENT STATES<br>NO ACTUAL CREDITS</div></div><div style="display:flex;justify-content:space-between;align-items:center;background:#e6eee5;border-radius:8px;padding:9px 11px;margin:11px 0 5px"><div><strong style="font-size:16px">G1 · Writing for Real Audiences</strong><div style="font-size:12px;color:#51695f;margin-top:2px">Expanded example · 3 individual competencies</div></div><span style="font-size:12px;background:#f7f1df;padding:5px 8px;border-radius:6px;color:#795b30;font-weight:bold">In progress</span></div><div style="display:grid;grid-template-columns:1fr 132px;gap:7px;align-items:center;padding:6px 5px;border-bottom:1px solid #e5e9e2"><div style="font-size:13px;line-height:1.22"><b>1.</b> Write clear, organized prose for a defined audience and purpose.<div style="font-size:11px;color:#60736a;margin-top:2px">Audio essay written for a public listening event</div></div><span style="font-size:11px;text-align:center;background:#d7e9dd;color:#286c4d;padding:7px 5px;border-radius:6px;font-weight:bold">Verified*</span></div><div style="display:grid;grid-template-columns:1fr 132px;gap:7px;align-items:center;padding:6px 5px;border-bottom:1px solid #e5e9e2"><div style="font-size:13px;line-height:1.22"><b>2.</b> Revise work using feedback from peers, instructors, and AI.<div style="font-size:11px;color:#60736a;margin-top:2px">Drafts and peer feedback documented; AI-use review outstanding</div></div><span style="font-size:11px;text-align:center;background:#f5e7c8;color:#815c23;padding:7px 5px;border-radius:6px;font-weight:bold">Review pending</span></div><div style="display:grid;grid-template-columns:1fr 132px;gap:7px;align-items:center;padding:6px 5px"><div style="font-size:13px;line-height:1.22"><b>3.</b> Edit for grammar, style, and tone.<div style="font-size:11px;color:#60736a;margin-top:2px">Specific editing evidence not yet documented</div></div><span style="font-size:11px;text-align:center;background:#e8e8e5;color:#606c65;padding:7px 5px;border-radius:6px;font-weight:bold">Needs evidence</span></div><div style="border-top:1px solid #cdd7cc;margin-top:8px;padding-top:7px"><div class="micro" style="font-size:10px;margin-bottom:4px">OTHER COURSE GROUPINGS · COLLAPSED VIEW</div><div style="display:grid;grid-template-columns:1fr 130px;gap:5px;font-size:12px;line-height:1.15"><span><b>G2 · Research and Argument</b> · sourced musical history</span><span style="color:#815c23;font-weight:bold;text-align:right">Evidence to review</span><span><b>G5 · Speaking with Purpose</b> · presentation and Q&amp;A</span><span style="color:#286c4d;font-weight:bold;text-align:right">Demonstrated*</span><span><b>D5 · Community Engagement</b> · needs analysis and pilot</span><span style="color:#815c23;font-weight:bold;text-align:right">Partially evidenced</span><span><b>G6 · Life Science</b> · human biology and lab</span><span style="color:#67746d;font-weight:bold;text-align:right">Not yet evidenced</span></div></div></div><div style="display:flex;flex-direction:column;gap:10px"><div class="tile sage" style="padding:16px 18px;flex:1"><div class="micro">THE IMPORTANT DISTINCTION</div><h3 style="font-size:23px;margin:8px 0">Progress isn't all-or-nothing.</h3><p style="font-size:14px;line-height:1.4">A learner could have a verified competency, work still awaiting judgment, and gaps—all within one familiar course grouping.</p></div><div class="tile sand" style="padding:16px 18px;flex:1"><div class="micro">WHAT THE RECORD CAN'T CLAIM</div><h3 style="font-size:23px;margin:8px 0">A completed degree.</h3><p style="font-size:14px;line-height:1.4">Alex's story doesn't establish all 60 competencies. The missing science, quantitative, and track requirements would still need rigorous learning and verification.</p></div><div class="tile" style="padding:12px 18px"><div class="micro">BEYOND THE TRANSCRIPT</div><p style="font-size:12px;line-height:1.32;margin:6px 0 0">A portfolio could also tell the story of curiosity, care, creativity, and direction.</p></div></div></div><p class="note" style="margin-top:7px;font-size:11px">*“Verified” and “Demonstrated” are hypothetical sample statuses showing how a real assessment system might work. No real assessment or credit award has occurred.</p></div>${sourceFooter('ILLUSTRATIVE RECORD · ASSESS EACH COMPETENCY SEPARATELY')}`,

()=>`<div class="slide-inner"><div class="eyeline">An invitation to the team</div><h2>What do we want to carry forward?</h2><p class="lead" style="max-width:1120px">Some of these ideas may be way out there. That's part of the point: we wanted to imagine what education could look like if we didn't begin with courses, credits, or a transcript.</p><div class="lines" style="margin-top:22px;padding:17px 23px"><p class="quote" style="font-size:28px;line-height:1.27">Could we create a radically different experience on the inside—and still produce the familiar, trustworthy records the world needs on the outside?</p></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:29px"><div><div class="micro" style="margin-bottom:8px">WHAT RESONATES?</div><div class="serif" style="font-size:29px;line-height:1.17">Which ideas, or parts of their spirit, would we want to bring into Untamed?</div><p style="font-size:16px;line-height:1.45;margin-top:12px">What feels energizing, promising, or worth protecting—even if we'd never implement the example literally?</p></div><div><div class="micro" style="margin-bottom:8px">WHAT'S THE ADJACENT POSSIBLE?</div><div class="serif" style="font-size:29px;line-height:1.17">What could we try now that moves us toward the education we ultimately aspire to?</div><p style="font-size:16px;line-height:1.45;margin-top:12px">What small experiments could test the most important ideas, without committing to the whole vision today?</p></div></div><div class="row spread" style="margin-top:26px;align-items:center"><div class="note" style="max-width:870px"><strong>For our discussion:</strong> What future would we be proud to work toward? And which first step would teach us something useful?</div><button class="readmore" data-action="ideas">Browse all 76 provocations ↗</button></div></div>${sourceFooter('AN EXPLORATION, NOT A PROPOSED PROGRAM')}`
];
